<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Source Serif 4";
      src: url("./SourceSerif4-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./IBMPlexSans-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1792px;
      height: 1008px;
      overflow: hidden;
      background: #F4F1EA;
    }
    .card {
      position: relative;
      width: 1792px;
      height: 1008px;
      background-image: url("./paper.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lockup {
      text-align: center;
      transform: translateY(-8px);
    }
    .wordmark {
      font-family: "Source Serif 4", "Iowan Old Style", Georgia, serif;
      font-weight: 700;
      font-size: 210px;
      letter-spacing: 0.22em;
      color: #1B314C;
      margin: 0;
      padding: 0 0 0 0.22em;
      line-height: 0.92;
      font-kerning: normal;
      -webkit-font-smoothing: antialiased;
    }
    .rule {
      width: 280px;
      height: 3px;
      background: #C4A35A;
      margin: 44px auto 34px;
      border-radius: 1px;
    }
    .tag {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 0.36em;
      color: #1B314C;
      margin: 0;
      padding: 0 0 0 0.36em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <h1 class="wordmark">FORUM</h1>
      <div class="rule"></div>
      <p class="tag">A CIVIC DESIGN SYSTEM</p>
    </div>
  </div>
</body>
</html>
